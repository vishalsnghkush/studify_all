buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 23
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.8.0"
        googlePlayServicesAuthVersion = "20.7.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.google.gms:google-services:4.4.2")
        classpath("com.android.tools.build:gradle:8.2.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Remove Sonatype snapshot repositories to avoid 504 Gateway Timeouts safely
    if (state.executed) {
        def toRemove = repositories.findAll { repo ->
            repo instanceof MavenArtifactRepository && repo.url.toString().contains("sonatype")
        }
        toRemove.each { repo ->
            println "Removing repository directly: ${repo.url}"
            repositories.remove(repo)
        }
    } else {
        afterEvaluate { prj ->
            def toRemove = prj.repositories.findAll { repo ->
                repo instanceof MavenArtifactRepository && repo.url.toString().contains("sonatype")
            }
            toRemove.each { repo ->
                println "Removing repository afterEvaluate: ${repo.url}"
                prj.repositories.remove(repo)
            }
        }
    }
}

subprojects { prj ->
    def configAction = { p ->
        if (p.hasProperty("android")) {
            p.android {
                try {
                    externalNativeBuild {
                        cmake {
                            arguments "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
                        }
                        ndkBuild {
                            arguments "APP_LDFLAGS=-Wl,-z,max-page-size=16384"
                        }
                    }
                } catch (Exception e) {
                    // Ignore if externalNativeBuild block does not exist or isn't configurable
                }
            }
        }
    }
    if (prj.state.executed) {
        configAction(prj)
    } else {
        prj.afterEvaluate {
            configAction(prj)
        }
    }
}
